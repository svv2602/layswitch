[package]
name = "layswitch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
evdev = "0.13.2"
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
panic = "abort"
lto = "thin"

[profile.dev]
panic = "abort"
